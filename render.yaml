# A separate static site. This file does not modify ant-website's Blueprint.
# Assumes ant-vr is the repository root; set rootDir for a monorepo.
services:
  - name: ant-vr
    type: web
    runtime: static
    buildCommand: npm ci && npm run check && npm test && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Permissions-Policy
        value: xr-spatial-tracking=(self)
